[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "contract-verifier"
version = "0.3.1"
description = "Lightweight CLI to verify HTTP services against contract specs"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
    {name = "Alex K.", email = "alex@local"}
]
dependencies = [
    "httpx>=0.25.0",
    "jsonschema[format-nongpl]>=4.19.0",
    "pyyaml>=6.0.1",
    "rich>=13.4.0",
]

[project.scripts]
contract-verifier = "contract_verifier.cli:main"

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.21.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
